name: PecheurConnect Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

# ============================================================================
# ✅ AJOUT : Force Node.js 24 (élimine warnings deprecation)
# ============================================================================
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    # ✅ AJOUT : Redéfinir au niveau job pour garantie
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📁 Prepare Directories
        run: mkdir -p logs/history logs/stats

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔍 Debug secrets (noms uniquement)
        run: |
          echo "TELEGRAM_BOT_TOKEN défini : ${{ secrets.TELEGRAM_BOT_TOKEN != '' }}"
          echo "TG_ID défini             : ${{ secrets.TG_ID != '' }}"
          echo "COPERNICUS_USERNAME      : ${{ secrets.COPERNICUS_USERNAME != '' }}"
          echo "OPENWEATHER_API_KEY      : ${{ secrets.OPENWEATHER_API_KEY != '' }}"

      - name: 🔬 Diagnostic copernicusmarine
        run: |
          echo "=== Version installée ==="
          pip show copernicusmarine | grep -E "Name|Version|Location"
          echo ""
          echo "=== Test import direct ==="
          python -c "
          import sys
          print('Python:', sys.version)
          try:
              import copernicusmarine as cm
              print('OK Import — version:', cm.__version__)
          except ImportError as e:
              print('FAIL ImportError:', e)
          except Exception as e:
              import traceback
              print('FAIL', type(e).__name__, ':', e)
              traceback.print_exc()
          "

      - name: 🌊 Run PecheurConnect Script
        timeout-minutes: 20
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_TOKEN:           ${{ secrets.TG_TOKEN }}
          TG_ID:              ${{ secrets.TG_ID }}
          # copernicusmarine v2.x lit ces noms exactement
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUS_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUS_PASSWORD }}
          # Fallback anciens noms pour compatibilité script
          COPERNICUS_USERNAME: ${{ secrets.COPERNICUS_USERNAME }}
          COPERNICUS_PASSWORD: ${{ secrets.COPERNICUS_PASSWORD }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: python script_peche.py

      - name: ✅ Verify Outputs
        run: |
          if [ -f data.json ]; then
            echo "✅ data.json généré ($(wc -c < data.json) octets)"
            python -c "
          import json
          with open('data.json') as f:
              d = json.load(f)
          s = d.get('stats', {})
          print(f\"  Zones : {d['meta']['total_zones']}\")
          print(f\"  Score moyen : {s.get('score_moyen', '?')}/10\")
          print(f\"  Danger : {s.get('zones_count', {}).get('danger', 0)} zones\")
          print(f\"  Sources : {d['meta']['sources']}\")
            "
          else
            echo "❌ data.json manquant — arrêt."
            exit 1
          fi

      - name: 💾 Commit and Push
        run: |
          git config user.name  "PecheurConnect Bot"
          git config user.email "bot@pecheurconnect.sn"
          git add data.json
          [ -f seasonality_data.json ] && git add seasonality_data.json || true
          git diff --staged --quiet || \
            git commit -m "🌊 Update $(date -u '+%Y-%m-%d %H:%M UTC')" && \
            git push

      - name: 🔔 Notify failure on Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_TOKEN:           ${{ secrets.TG_TOKEN }}
          TG_ID:              ${{ secrets.TG_ID }}
        run: |
          TOKEN="${TELEGRAM_BOT_TOKEN:-$TG_TOKEN}"
          if [ -n "$TOKEN" ] && [ -n "$TG_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
              -d chat_id="${TG_ID}" \
              -d parse_mode="HTML" \
              -d text="⚠️ <b>PecheurConnect</b> — Échec workflow
          🕑 $(date -u '+%Y-%m-%d %H:%M UTC')
          🔗 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            echo "Telegram non configuré."
          fi
