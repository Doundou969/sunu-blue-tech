name: CI - Tests et Qualité (Node.js 24)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# ============================================================================
# CONFIGURATION GLOBALE - Node.js 24
# ============================================================================
env:
  # Python
  PYTHON_VERSION: "3.11"
  
  # ✅ CRITICAL: Force Node.js 24 pour TOUTES les actions JavaScript
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ============================================================================
  # JOB 1: TESTS UNITAIRES ET INTÉGRATION
  # ============================================================================
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    
    # ✅ Redéfinir au niveau du job pour garantie
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        # ✅ v4.2.0+ est compatible Node.js 24
      
      - name: 🐍 Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        # ✅ v5.3.0+ est compatible Node.js 24
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_bot.txt
          pip install pytest pytest-cov pytest-asyncio pytest-mock
      
      - name: 🧪 Run unit tests
        env:
          COPERNICUS_USERNAME: ${{ secrets.COPERNICUS_USERNAME }}
          COPERNICUS_PASSWORD: ${{ secrets.COPERNICUS_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN_TEST }}
        run: |
          pytest tests/unit \
            --cov=. \
            --cov-report=xml \
            --cov-report=term-missing \
            -v
      
      - name: 🔗 Run integration tests
        if: github.event_name == 'push'
        env:
          COPERNICUS_USERNAME: ${{ secrets.COPERNICUS_USERNAME }}
          COPERNICUS_PASSWORD: ${{ secrets.COPERNICUS_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN_TEST }}
        run: |
          pytest tests/integration \
            --cov=. \
            --cov-append \
            --cov-report=xml \
            -v
      
      - name: 📊 Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        # ✅ v5 compatible Node.js 24
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-${{ matrix.python-version }}

  # ============================================================================
  # JOB 2: QUALITÉ DU CODE
  # ============================================================================
  quality:
    name: Qualité du Code
    runs-on: ubuntu-latest
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: 📦 Install tools
        run: |
          pip install ruff mypy bandit safety
          pip install -r requirements_bot.txt
      
      - name: 🎨 Ruff - Format check
        run: |
          ruff format --check .
      
      - name: 🔍 Ruff - Lint
        run: |
          ruff check . --output-format=github
      
      - name: 🔎 MyPy - Type checking
        run: |
          mypy script_peche_complet.py bot_telegram.py --ignore-missing-imports
      
      - name: 🔐 Bandit - Security scan
        run: |
          bandit -r . -f json -o bandit-report.json || true
          bandit -r . -f txt
      
      - name: 🛡️ Safety - Dependencies vulnerabilities
        run: |
          safety check --json || true
          safety check
      
      - name: 📤 Upload security reports
        uses: actions/upload-artifact@v4
        # ✅ v4.4.0+ compatible Node.js 24
        if: always()
        with:
          name: security-reports-${{ github.run_id }}
          path: bandit-report.json
          retention-days: 30

  # ============================================================================
  # JOB 3: TESTS E2E (End-to-End)
  # ============================================================================
  e2e:
    name: Tests End-to-End
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, quality]
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: 📦 Install dependencies
        run: |
          pip install -r requirements_bot.txt
          pip install pytest pytest-asyncio
      
      - name: 🌐 Run E2E tests
        env:
          COPERNICUS_USERNAME: ${{ secrets.COPERNICUS_USERNAME }}
          COPERNICUS_PASSWORD: ${{ secrets.COPERNICUS_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN_TEST }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          pytest tests/e2e -v --tb=short
      
      - name: 📊 Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results-${{ github.run_id }}
          path: tests/e2e/results/
          retention-days: 7

  # ============================================================================
  # JOB 4: BUILD DOCKER
  # ============================================================================
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, quality]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        # ✅ v3 compatible Node.js 24
      
      - name: 🔑 Login to GitHub Container Registry
        uses: docker/login-action@v3
        # ✅ v3 compatible Node.js 24
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 🏷️ Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        # ✅ v5 compatible Node.js 24
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix={{branch}}-
      
      - name: 🐳 Build and push
        uses: docker/build-push-action@v6
        # ✅ v6 compatible Node.js 24
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # JOB 5: NOTIFICATION
  # ============================================================================
  notify:
    name: Notification
    runs-on: ubuntu-latest
    needs: [test, quality, e2e]
    if: always()
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    
    steps:
      - name: 📱 Send Telegram notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TG_TOKEN }}
          format: markdown
          message: |
            🤖 **CI Pipeline - PecheurConnect**
            
            **Branch:** `${{ github.ref_name }}`
            **Commit:** `${{ github.sha }}`
            **Author:** ${{ github.actor }}
            
            **Tests:** ${{ needs.test.result }}
            **Quality:** ${{ needs.quality.result }}
            **E2E:** ${{ needs.e2e.result }}
            
            [Voir les détails](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
